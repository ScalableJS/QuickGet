name: CI

on:
  # `env/prod` is covered by deploy.yml, which runs the same gates before publishing;
  # without this filter every push there would run the whole suite twice.
  push:
    branches-ignore:
      - env/prod
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, unit, builds, and mock E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check Svelte
        run: npm run check:svelte

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run deployment unit tests
        run: npm run test:deploy

      - name: Build extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The mock suite loads `dist-dev`, built by this script's own `pretest` step. The production
      # build above still runs: it must compile, and the store assets are cut from it.
      - name: Run mock E2E tests
        run: npm run test:e2e:mock

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Validate Firefox package
        run: npm run lint:firefox

      - name: Package Firefox extension
        run: npm run package:firefox:from-dist

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: quickget-remote-firefox
          path: web-ext-artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
