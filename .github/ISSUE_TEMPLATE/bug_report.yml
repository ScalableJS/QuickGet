name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The three version fields below are the ones
        that usually explain a bug, so please fill them in even if they seem irrelevant.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: I clicked a .torrent link on … and the task never appeared on the NAS.
    validations:
      required: true
  - type: input
    id: qts-version
    attributes:
      label: QTS / QuTS hero version
      description: Control Panel → System → System Status
      placeholder: "QTS 5.2.1"
    validations:
      required: true
  - type: input
    id: ds-version
    attributes:
      label: Download Station version
      description: App Center → Download Station
      placeholder: "5.6.1"
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: chrome://extensions, or the footer of the Settings panel
      placeholder: "2.1.0"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output (optional)
      description: |
        chrome://extensions → QuickGet Remote → "service worker" → Console. Lines are prefixed
        with `[QuickGet]`.
      render: text
  - type: checkboxes
    id: no-secrets
    attributes:
      label: Before you post
      options:
        - label: I have removed my NAS address, username, password and any session id from the text above.
          required: true
